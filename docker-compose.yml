services:
  mongo:
    image: mongo:7
    container_name: agrismart-mongo
    ports:
      - "27017:27017"
    volumes:
      - agrismart_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  agrismart_mongo_data:
